services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    container_name: lab-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    secrets:
      - db_password
      - ntfy_publish_token
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "PASSWORD=$$(cat /run/secrets/db_password); ENCODED=$$(PASSWORD=\"$$PASSWORD\" python3 -c \"import os, urllib.parse; print(urllib.parse.quote_plus(os.environ['PASSWORD']))\"); migrate -path /migrations -database postgres://lab:$$ENCODED@postgres:5432/lab?sslmode=disable up || { TOKEN=$$(cat /run/secrets/ntfy_publish_token 2>/dev/null || true); curl -s -X POST http://ntfy:80/lab-system -H 'Title: 数据库迁移失败' -H 'Priority: urgent' -H 'Tags: warning' -H \"Authorization: Bearer $$TOKEN\" -d 'migration failed' >/dev/null 2>&1; exit 1; }"

  epics-gateway:
    build:
      context: ../go-server/epics-gateway
    environment:
      EPICS_CA_ADDR_LIST: ${EPICS_CA_ADDR_LIST:-ioc:5064}
      EPICS_CA_AUTO_ADDR_LIST: "NO"
    expose:
      - "5070"
    restart: unless-stopped

  influxdb:
    image: docker.m.daocloud.io/influxdb:2-alpine
    container_name: lab-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - /var/lib/influxdb:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-lab-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-lab-bucket}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    # 锁版本（P1-3）：升级遵循 docs/maintenance-strategy.md 双 MINOR/3 个月窗口策略
    image: docker.m.daocloud.io/grafana/grafana:11.1.0
    container_name: lab-grafana
    restart: unless-stopped
    # admin 密码走 secret：Grafana 官方镜像不支持 *_FILE 环境变量，entrypoint 内 cat 注入
    entrypoint: ["/bin/sh", "-c", "export GF_SECURITY_ADMIN_PASSWORD=$$(cat /run/secrets/grafana_admin_password); exec /run.sh"]
    ports:
      # 默认仅绑定 127.0.0.1；外网访问走 frp/VPS 反代（参照 ntfy 的 10.144.144.12:8087 模式）
      - "${GRAFANA_BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      # provisioning 文件 ${VAR} 插值来源（P1-3，缺一不可）
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-lab-org}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-lab-bucket}
    volumes:
      - /opt/lab-monitor/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    depends_on:
      influxdb:
        condition: service_healthy

  ioc:
    build: ../py-agent/ioc
    container_name: lab-ioc
    restart: unless-stopped
    ports:
      - "5064:5064"
      - "5064:5064/udp"
      - "5080:5080"
    environment:
      EPICS_CAS_INTF_ADDR_LIST: 0.0.0.0
      EPICS_CAS_SERVER_PORT: "5064"
      PYTHONUNBUFFERED: "1"
      OPC_URL: opc.tcp://10.51.12.158:4862
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN_FILE: /run/secrets/influxdb_token
      INFLUX_ORG: ${INFLUXDB_ORG:-lab-org}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET:-lab-bucket}
      SENSOR_DB_PATH: /data/sensor_history.db
      # ntfy 发布凭据（lab-system 主题 todo-publisher 的 Bearer token；deny-all 下无凭据发
      # 送会被 403 静默丢弃，P0-1 修复：IOC 仪器域告警恢复）
      NTFY_PUBLISH_TOKEN_FILE: /run/secrets/ntfy_publish_token
      # 告警中心（方案 §8.1 #12）：调 Go alert report/resolve 用 service_token
      #（与 ntfy 发布 token 是两套凭证）；GO_API_BASE 指向 server 的 compose 网络地址
      SERVICE_TOKEN_FILE: /run/secrets/service_token
      GO_API_BASE: http://server:8000
    secrets:
      - influxdb_token
      - ntfy_publish_token
      - service_token
    volumes:
      - /opt/lab-monitor/sqlite:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5080/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      influxdb:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lab-server
    user: "${UPDATE_RUN_UID:-1000}:${UPDATE_RUN_GID:-1000}"
    group_add:
      - "${UPDATE_DOCKER_GID:-993}"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: lab
      DB_NAME: lab
      PORT: 8000
      # SourceGate 回滚开关（2026-08-10 生产事故）：docker 健康检查(127.0.0.1)/容器互调(172.x)
      # 不在 10.144.144.0/24 白名单 → 全被 403，server unhealthy + worker 全断。禁用待完整测试。
      SOURCE_GATE_ENABLED: "false"
      EPICS_GATEWAY_ADDR: epics-gateway:5070
      INFLUXDB_ADDR: ${INFLUXDB_ADDR:-http://influxdb:8086}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-lab-org}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-lab-bucket}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-placeholder}
      INFLUXDB_MEASUREMENTS: ${INFLUXDB_MEASUREMENTS:-pressure,vacuum,control,temperature,pump}
      PY_AGENT_INTERPRET_URL: http://py-agent-interpret:8001
      PY_AGENT_INTERNAL_TOKEN_FILE: /run/secrets/agent_password
      KEYSIGHT_33210A_ADDR: ${KEYSIGHT_33210A_ADDR:-}
      REPO_ROOT: /opt/hiaf-lab-system
      UPDATE_ENGINE: ${UPDATE_ENGINE:-go}
      UPDATE_FLAGS: ${UPDATE_FLAGS:-}
      UPDATE_RUN_UID: ${UPDATE_RUN_UID:-1000}
      UPDATE_RUN_GID: ${UPDATE_RUN_GID:-1000}
      UPDATE_DOCKER_GID: ${UPDATE_DOCKER_GID:-993}
      UPDATE_GIT_HOME: ${UPDATE_GIT_HOME:-}
      # 必须是宿主机绝对路径（runner 容器经 docker.sock 以该路径挂载，容器内外路径一致）
      UPDATE_BACKUP_DIR: ${UPDATE_BACKUP_DIR:-/opt/hiaf-lab-system/.hermes/backups}
      # 会话日志目录：server 写 marker/tail 日志，runner 容器以同路径挂载写入
      UPDATE_LOG_DIR: ${UPDATE_LOG_DIR:-/opt/hiaf-lab-system/.hermes/updates}
      # ntfy 地址：runner 容器以 --network host 运行（宿主机网络栈），
      # 必须用宿主可达地址（ntfy 发布 127.0.0.1:8085），不能用 compose 网络内的 ntfy:80。
      UPDATE_NTFY_URL: ${UPDATE_NTFY_URL:-http://localhost:8085/lab-system}
      # Todolist：service token 拉取日报、ntfy 发布 token、scheduler 开关、ntfy 对外地址
      SERVICE_TOKEN_FILE: /run/secrets/service_token
      NTFY_PUBLISH_TOKEN_FILE: /run/secrets/ntfy_publish_token
      TODOS_SCHEDULER_ENABLED: ${TODOS_SCHEDULER_ENABLED:-true}
      NTFY_PUBLIC_URL: ${NTFY_PUBLIC_URL:-http://10.144.144.12:8087}
      # CORS 白名单（P1-4）：生产同源无需配置；独立域名/端口前端在 .env 追加
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    secrets:
      - db_password
      - jwt_key
      - influxdb_token
      - agent_password
      - service_token
      - ntfy_publish_token
    ports:
      - "8000:8000"
    volumes:
      # 仓库只读挂载；server 不写仓库，更新由 runner 容器以可写方式自行挂载执行
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/hiaf-lab-system:/opt/hiaf-lab-system:ro
      # 更新日志/备份目录以相同路径 rw 挂载（子路径覆盖在 ro 仓库挂载之上），与 runner 容器共享
      - /opt/hiaf-lab-system/.hermes/updates:/opt/hiaf-lab-system/.hermes/updates
      - /opt/hiaf-lab-system/.hermes/backups:/opt/hiaf-lab-system/.hermes/backups
      # ntfy 共享 auth-file（ntfy CLI 与 lab-ntfy 服务读写同一 SQLite，见 init_ntfy.sh 属主说明）
      - ntfy-etc:/etc/ntfy
      # server 容器内 ntfy CLI 默认读 /etc/ntfy/server.yml 定位 auth-file，
      # 必须与 lab-ntfy 挂同一份配置（只读），否则 CLI 可能写到错误路径
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      epics-gateway:
        condition: service_started
      py-agent-interpret:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  py-agent:
    build:
      context: ../py-agent
      dockerfile: Dockerfile
    container_name: lab-py-agent
    environment:
      GO_API_BASE: http://server:8000
      AGENT_USERNAME: agent@system
      AGENT_PASSWORD_FILE: /run/secrets/agent_password
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      # worker 死信告警发 ntfy 的 Bearer token（与 Go 侧 notify 同源凭据，C6 修复）
      NTFY_PUBLISH_TOKEN_FILE: /run/secrets/ntfy_publish_token
      # ask/execute 的 service_token（与 Go server 的 SERVICE_TOKEN 同源）；
      # 实际出站调用在 py-agent-interpret（serve.py），此处与下方容器一起注入
      SERVICE_TOKEN_FILE: /run/secrets/service_token
    secrets:
      - agent_password
      - ntfy_publish_token
      - service_token
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://server:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  py-agent-interpret:
    build:
      context: ../py-agent
      dockerfile: Dockerfile
    command: ["python", "serve.py"]
    environment:
      # AskEngine 出站调 Go ask/execute 的内部地址（与 py-agent worker 一致，server:8000）
      GO_API_BASE: http://server:8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-}
      PY_AGENT_INTERNAL_TOKEN_FILE: /run/secrets/agent_password
      # /v1/ask 的 AskEngine 出站调 Go ask/execute 的 service_token（与 server 同源）
      SERVICE_TOKEN_FILE: /run/secrets/service_token
    secrets:
      - agent_password
      - service_token
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ntfy:
    # 镜像锁定版本（与 deploy/Dockerfile 的 ntfy-cli 阶段一致：auth-file schema 兼容）
    image: binwiederhier/ntfy:v2.27.0
    container_name: lab-ntfy
    command: serve
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy
      # server.yml 只读挂载：auth-file/auth-default-access/WAL 等（见 deploy/ntfy/server.yml）
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
    ports:
      - "127.0.0.1:8085:80"
      - "10.144.144.12:8087:80"
    restart: unless-stopped

  prometheus:
    # 锁版本（P2-2）：升级遵循 docs/maintenance-strategy.md 双 MINOR/3 个月窗口策略
    image: docker.m.daocloud.io/prom/prometheus:v2.53.0
    container_name: lab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/lab-monitor/prometheus:/prometheus
    ports:
      # 默认仅绑定 127.0.0.1（同 Grafana 模式）
      - "${PROMETHEUS_BIND_ADDR:-127.0.0.1}:9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    restart: unless-stopped

volumes:
  pgdata:
  influxdb_config:
  ntfy-cache:
  ntfy-etc:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_key:
    file: ./secrets/jwt_key.txt
  influxdb_token:
    file: ./secrets/influxdb_token.txt
  agent_password:
    file: ./secrets/agent_password.txt
  # 以下两个由 deploy/scripts/init_ntfy.sh 生成（todo 发布 token + 内部 service token）
  ntfy_publish_token:
    file: ./secrets/ntfy_publish_token.txt
  service_token:
    file: ./secrets/service_token.txt
  # 由 deploy/scripts/init_ntfy.sh 生成（Grafana admin 登录密码，P1-3）
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
