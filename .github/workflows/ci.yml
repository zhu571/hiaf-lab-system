name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  main-pr-gate:
    name: Require PR for main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify main update came from a merged PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          subject="$(git show -s --format=%s "$SHA")"
          if [ "$ACTOR" = "github-actions[bot]" ] && [ "$subject" = "ci: revert direct push to main" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "Allowing CI-generated rollback commit."
            exit 0
          fi

          pr_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.state == "closed" and .merged_at != null and .base.ref == "main")] | length'
          )"

          if [ "$pr_count" -gt 0 ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "main was updated by a merged PR."
            exit 0
          fi

          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "::error::Direct pushes to main are not allowed. Open a PR and merge it instead."
          exit 1

  revert-direct-main-push:
    name: Revert direct main push
    runs-on: ubuntu-latest
    needs: main-pr-gate
    if: always() && needs.main-pr-gate.outputs.authorized == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Revert unauthorized main update
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Cannot safely auto-revert the first commit on main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if ! git merge-base --is-ancestor "$AFTER" HEAD; then
            echo "main has moved past $AFTER; skip automatic rollback."
            exit 0
          fi

          commits="$(git rev-list "$BEFORE..$AFTER")"
          if [ -z "$commits" ]; then
            echo "No commits to revert."
            exit 0
          fi

          for commit in $commits; do
            parent_count="$(git show -s --format=%P "$commit" | wc -w | tr -d ' ')"
            if [ "$parent_count" -gt 1 ]; then
              git revert --no-commit --mainline 1 "$commit"
            else
              git revert --no-commit "$commit"
            fi
          done

          if git diff --cached --quiet && git diff --quiet; then
            echo "Rollback produced no changes."
            exit 0
          fi

          git commit -m "ci: revert direct push to main" \
            -m "Direct pushes to main are not allowed. Use a pull request." \
            -m "Reverted push ending at $AFTER."
          git push origin HEAD:main

  go-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Apply migrations
        env:
          PGID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for f in migrations/*.up.sql; do
            echo "applying $f"
            docker exec -i "$PGID" psql -U lab -d lab_test < "$f"
          done
      - name: Test and vet Go backend
        env:
          TEST_DATABASE_URL: postgres://lab:lab@localhost:5432/lab_test?sslmode=disable
        run: |
          if [ ! -f go-server/go.mod ]; then
            echo "go-server/go.mod not found; Go backend not implemented yet, skipping."
            exit 0
          fi
          cd go-server
          # -p 1：db 测试共用同一 TEST_DATABASE_URL，跨包固定 UUID 种子并行会撞主键 flaky
          #（如 agent 与 issues 的 b140 用户），按测试策略方案 §4.3.1 串行化包级测试。
          # -coverprofile：覆盖率透明化（P3，方案 §5），只报告不设硬阈值、不阻塞。
          # ./testdata/ 精确路径：testdata 是 Go 保留目录名，`./...` 通配会跳过它，
          # 但 testdata 模块（测试数据业务）的测试必须执行（本地 76.7% 覆盖）。
          go test -race -p 1 -coverprofile=/tmp/hiaf-coverage.out ./... ./testdata/
          # testdata 同原因：`./...` 通配跳过，显式补路径才能 vet 到（go test 内嵌 vet 之外的全量检查）。
          go vet ./... ./testdata/
      - name: Coverage summary (non-blocking)
        run: |
          if [ -f /tmp/hiaf-coverage.out ]; then
            echo "== Go 覆盖率汇总（P3，不设门禁，人工盯下降趋势）"
            go tool cover -func=/tmp/hiaf-coverage.out | tail -1 \
              || echo "coverage summary failed (non-blocking); check profile manually."
          else
            echo "no coverage profile produced; skipping."
          fi

  windows-cross-compile:
    name: Windows cross-compile check
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cross-compile Go backend for Windows
        run: |
          if [ ! -f go-server/go.mod ]; then
            echo "go-server/go.mod not found; Go backend not implemented yet, skipping."
            exit 0
          fi
          cd go-server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
          # Compile-only test check: -exec=true skips running the Windows test binaries on Linux.
          # ./testdata/ 与 go-test job 同步：testdata 模块测试也纳入编译检查。
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -exec=true ./... ./testdata/

  migration-test:
    name: Database migrations up/down check
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Test all migrations up and down
        run: |
          if [ ! -d migrations ] || ! ls migrations/*.up.sql >/dev/null 2>&1; then
            echo "migrations not found; not implemented yet, skipping."
            exit 0
          fi
          bash scripts/test-migrations.sh

  frontend-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and build frontend
        run: |
          if [ ! -f web-ui/package.json ]; then
            echo "web-ui/package.json not found; frontend not implemented yet, skipping."
            exit 0
          fi
          cd web-ui
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json missing; commit the lockfile for reproducible CI."
            exit 1
          fi
          npm ci
          npm test --if-present
          npm run build --if-present
      - name: Check static sync
        run: |
          if [ ! -f web-ui/package.json ]; then
            echo "web-ui/package.json not found; frontend not implemented yet, skipping."
            exit 0
          fi
          cd web-ui
          # dist 由上一步 npm run build 产出（steps 共享工作区），此处只做一致性 diff
          diff -rq dist ../go-server/static || (echo "::error::web-ui/dist 与 go-server/static 不一致，请 rsync 同步" && exit 1)
      - name: Coverage report (non-blocking)
        run: |
          cd web-ui
          # vitest --coverage（@vitest/coverage-v8，stores/utils/i18n）：纯报告不阻塞 job
          npm run test:coverage || echo "::warning::vitest coverage report skipped"

  python-check:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python agent
        run: |
          if ! find py-agent -type f -name '*.py' | grep -q .; then
            echo "No Python agent files found; agent not implemented yet, skipping."
            exit 0
          fi
          if [ -f py-agent/requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r py-agent/requirements.txt
          fi
          python -m compileall -q py-agent
      - name: Run unit tests
        run: |
          python -m unittest discover -s py-agent/tests -v
      - name: Coverage report (non-blocking)
        run: |
          # coverage.py 在 requirements-dev.txt（生产依赖分离）；纯报告不阻塞 job
          python -m pip install coverage >/dev/null 2>&1 || true
          cd py-agent
          coverage run -m unittest discover -s tests -q && coverage report -m || echo "::warning::python coverage report skipped"

  # Playwright E2E 冒烟（测试策略方案 §4.4 / P2）：手动 workflow_dispatch 触发，
  # 不纳入 PR/push 必检——起完整栈（postgres + go build + vite + playwright）成本高。
  # schedule 暂不加（纯手动，避免定时跑费资源）；scripts/test-e2e.sh 自包含编排
  # （起 postgres 容器 → 全量迁移 → server(8000) → vite(5173) → playwright → trap 清理）。
  e2e-smoke:
    name: Playwright E2E smoke (manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    concurrency:
      group: e2e-smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ubuntu-latest runner 未把 postgresql-client 装入 PATH（step shell 不读 profile，
      # 且镜像装完即删 PGDG 源），而 scripts/test-e2e.sh 依赖命令检查 psql/pg_isready，
      # 故在此显式安装（Ubuntu 官方源 postgresql-client-16）。
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Install frontend dependencies
        run: |
          cd web-ui
          npm ci
      - name: Install Playwright chromium
        run: |
          cd web-ui
          npx playwright install chromium --with-deps
      - name: Run E2E smoke tests
        run: |
          bash scripts/test-e2e.sh
      # 失败时保留 playwright HTML 报告与 trace（VM 随 job 销毁，不传则无从排查）。
      - name: Upload Playwright artifacts (on failure)
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-ui/playwright-report/
            web-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
